[package]
name = "ds4u"
version = "0.1.4"
edition = "2024"
description = "DualSense 4 You"
authors = ["deadYokai"]
readme = "README.md"
repository = "https://git.yokai.digital/deadYokai/ds4u"
license = "MIT"
keywords = ["dualsense", "controller"]

[dependencies]
anyhow = "1.0.104"
crc = "3.4.0"
dirs = "6.0.0"
eframe = { version = "0.33.3", features = ["wgpu"] }
egui = "0.33.3"
egui_extras = { version = "0.33.3", features = ["svg", "svg_text", "file"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["native-tls", "json"] }
hidapi = { version = "2.6.7", default-features = false, features = [
  "linux-native",
] }
udev = "0.9.3"
alsa = "0.11.0"
rustix = { version = "1.1.6", features = ["event"] }
evdev = "0.13.2"

[features]
default = []
unstable = []

[build-dependencies]
roxmltree = "0.21.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev-release]
inherits = "release"
debug = false
strip = "none"
